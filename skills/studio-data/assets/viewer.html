<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>게임 설계 데이터</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --on-accent: #ffffff; --text: #1d2330; --muted: #667085; --line: #e4e7ec;
    --head: #f2f4f7; --accent: #3b5bdb; --err: #c92a2a; --err-bg: #fff0f0; --warn: #b35c00; --warn-bg: #fff6e5;
    --ok: #2b8a3e; --ok-bg: #ebfbee; --flash: #fff3bf; --info-bg: #edf2ff;
    --r-common: #868e96; --r-uncommon: #2f9e44; --r-rare: #1c7ed6; --r-epic: #9c36b5; --r-legendary: #e8590c;
    --rk-normal: #868e96; --rk-elite: #b35c00; --rk-boss: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1f27; --on-accent: #0d1426; --text: #e6e9ef; --muted: #98a2b3; --line: #2a313c;
      --head: #202631; --accent: #7c9cff; --err: #ff8787; --err-bg: #3a1f22; --warn: #ffb347; --warn-bg: #3a2c14;
      --ok: #69db7c; --ok-bg: #1d3323; --flash: #4a3f12; --info-bg: #1e2740;
      --r-common: #adb5bd; --r-uncommon: #69db7c; --r-rare: #74c0fc; --r-epic: #e599f7; --r-legendary: #ffa94d;
      --rk-normal: #adb5bd; --rk-elite: #ffb347; --rk-boss: #ff8787;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", "Noto Sans CJK KR", "NanumGothic", sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .muted { color: var(--muted); }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
  .mode { font-size: 12px; border-radius: 999px; padding: 2px 10px; border: 1px solid var(--line); background: var(--panel); }
  .mode.server { color: var(--ok); border-color: var(--ok); }
  .mode.file { color: var(--warn); border-color: var(--warn); }
  .live { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.off { background: var(--err); } .dot.idle { background: var(--muted); }
  .filebar { display: none; background: var(--info-bg); border: 1px dashed var(--accent); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; }
  .filebar.show { display: block; }
  .filebar.drag { background: var(--flash); }
  .filebar .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
  .btn { border: 1px solid var(--accent); background: var(--accent); color: var(--on-accent); border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .tab { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 10px; padding: 6px 12px; cursor: pointer; font: inherit; text-align: left; }
  .tab.on { border-color: var(--accent); box-shadow: inset 0 -3px 0 var(--accent); }
  .tab .fn { display: block; font-size: 11px; color: var(--muted); }
  .tab .cnt { font-size: 11px; margin-left: 6px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 16px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .chip b { font-weight: 600; }
  .chip.fail { color: var(--err); border-color: var(--err); }
  .chip.pass { color: var(--ok); border-color: var(--ok); }
  .chip.none { color: var(--warn); border-color: var(--warn); }
  .banner { border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; background: var(--err-bg); color: var(--err); border: 1px solid var(--err); }
  .notices { border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; background: var(--panel); color: var(--muted); border: 1px solid var(--line); font-size: 13px; white-space: pre-line; overflow-wrap: anywhere; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; }
  .panel > .ph { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  details.panel > summary { padding: 10px 14px; cursor: pointer; font-weight: 600; }
  .issues { list-style: none; margin: 0; padding: 0 14px 10px; }
  .issues li { padding: 4px 0; border-top: 1px dashed var(--line); cursor: pointer; }
  .issues li:first-child { border-top: 0; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 6px; margin-right: 6px; }
  .tag.err { background: var(--err-bg); color: var(--err); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.info { background: var(--head); color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 16px; }
  .controls input[type=search] { flex: 1 1 220px; min-width: 0; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  .controls select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  label.check { display: flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
  .tw { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; white-space: nowrap; }
  th { background: var(--head); font-weight: 600; font-size: 12px; color: var(--muted); }
  th.sortable { cursor: pointer; user-select: none; }
  th.sorted::after { content: " ▲"; }
  th.sorted.desc::after { content: " ▼"; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.text { white-space: normal; min-width: 220px; max-width: 360px; }
  tr.cut td { opacity: .5; }
  tr.cut td.name .nm { text-decoration: line-through; }
  tr.flash td { background: var(--flash); }
  tr.has-err td:first-child { box-shadow: inset 3px 0 0 var(--err); }
  tr.has-warn td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
  .nm { font-weight: 600; }
  .empty { color: var(--muted); }
  .pill { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: 12px; border: 1px solid currentColor; }
  .st-proposed { color: var(--accent); } .st-approved { color: var(--ok); } .st-cut { color: var(--muted); } .st-unspecified { color: var(--muted); border-style: dashed; }
  .pv-assumed { color: var(--warn); } .pv-computed { color: var(--accent); } .pv-measured { color: var(--ok); } .pv-decided { color: var(--ok); border-style: dotted; } .pv-unspecified { color: var(--muted); border-style: dashed; }
  .strong { font-weight: 600; }
  .badges { margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px; }
  .intent { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .group-note { font-size: 12px; color: var(--warn); padding: 8px 14px 0; }
  .group-meta { font-size: 12px; color: var(--muted); font-weight: 400; }
  .drops { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding: 12px 14px 14px; }
  .drop { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .bar { display: grid; grid-template-columns: 96px 1fr 64px; gap: 8px; align-items: center; font-size: 12px; margin: 4px 0; }
  .bar .track { height: 8px; background: var(--head); border-radius: 4px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); }
  footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
  .doc { padding: 14px 16px 16px; }
  .doc .pitch { font-size: 15px; margin: 0 0 8px; }
  .doc blockquote { margin: 0 0 14px; padding: 8px 12px; border-left: 3px solid var(--accent); background: var(--head); border-radius: 0 8px 8px 0; }
  .doc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px 20px; }
  .doc h3 { font-size: 13px; color: var(--muted); margin: 10px 0 4px; font-weight: 600; }
  .doc ul, .doc ol { margin: 0; padding-left: 20px; }
  .doc li { margin: 2px 0; }
  .doc .test { color: var(--muted); }
  .doc dl { display: grid; grid-template-columns: max-content 1fr; gap: 2px 10px; margin: 0; }
  .doc dt { color: var(--muted); }
  .doc dd { margin: 0; }
  .doc table td, .doc table th { white-space: normal; }
  .res { display: inline-block; font-size: 11px; border-radius: 4px; padding: 0 5px; margin: 0 4px 2px 0; border: 1px solid var(--line); }
  .res.dominates { color: var(--err); border-color: var(--err); } .res.loses { color: var(--ok); border-color: var(--ok); }
  .res.competitive { color: var(--warn); border-color: var(--warn); } .res.unknown { color: var(--muted); border-style: dashed; }
  td.off { background: var(--warn-bg); color: var(--warn); font-weight: 600; }
  td.ok-cell { color: var(--ok); }
  .vd-holds { color: var(--ok); } .vd-refuted { color: var(--err); } .vd-unknown { color: var(--muted); border-style: dashed; }
  .sig { display: inline-block; font-size: 11px; background: var(--head); border-radius: 4px; padding: 0 5px; margin: 0 4px 2px 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <h1>게임 설계 데이터</h1>
    <span class="mode" id="mode"></span>
    <span class="live"><span class="dot idle" id="dot"></span><span id="live">불러오는 중…</span></span>
  </header>

  <section class="filebar" id="filebar" aria-label="파일 불러오기">
    <div class="row">
      <button class="btn" id="pick" type="button">불러오기</button>
      <button class="btn ghost" id="reload" type="button" hidden>다시 불러오기</button>
      <span>JSON 파일을 고르거나 여기로 끌어다 놓으세요. 여러 개를 함께 고를 수 있습니다.</span>
      <input type="file" id="file-input" accept=".json,application/json" multiple hidden>
    </div>
    <div class="note" id="file-note">
      파일 모드는 원본에 적힌 값만 보여 줍니다. 검사(열위·역전·참조)와 계산(점수·위협도·확률)은 하지 않습니다.
      검사 결과까지 보려면 게임 프로젝트 폴더에서 서버로 실행하세요: <span class="mono">python3 .claude/skills/studio-data/scripts/studio.py view .</span>
      (Codex 설치는 <span class="mono">.agents/skills/…</span>, Windows PowerShell은 <span class="mono">py</span>)
    </div>
  </section>

  <div id="banner" class="banner" hidden></div>
  <div id="notices" class="notices" hidden></div>
  <nav class="tabs" id="tabs" aria-label="데이터 종류"></nav>
  <div class="chips" id="summary"></div>
  <details class="panel" id="issues-panel" hidden>
    <summary id="issues-title"></summary>
    <ul class="issues" id="issues"></ul>
  </details>
  <div class="controls" id="controls" hidden>
    <input type="search" id="q" placeholder="이름·id·효과 검색" aria-label="검색">
    <div class="seg" id="groups" role="group"></div>
    <select id="status" aria-label="상태">
      <option value="">상태 전체</option>
      <option value="proposed">제안</option>
      <option value="approved">승인</option>
      <option value="cut">삭제</option>
      <option value="unspecified">미지정</option>
    </select>
    <label class="check" id="only-issues-wrap"><input type="checkbox" id="only-issues"> 문제 있는 것만</label>
  </div>
  <div id="sections"></div>
  <div id="extras"></div>
  <footer id="footer"></footer>
</main>

    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}

function numColumn(key, text, get, show) {

/* ---------- 검사 결과 위치 찾기 (서버 모드) ---------- */
function indexIssues(ds) {
  const res = { all: [], byEntry: {}, byGroup: {}, byTable: {} };
  if (!ds.report) return res;
  const kind = KINDS[ds.kind], list = Array.isArray(ds.data[kind.listKey]) ? ds.data[kind.listKey] : [];
  const groups = new Set(list.filter((e) => e && typeof e === "object").map(kind.groupOf));
  const tables = new Set(Object.keys(ds.data.drop_tables || {}));
  for (const [level, items] of [["err", ds.report.errors], ["warn", ds.report.warnings]]) {
    for (const it of items) {
      let where = it.where;
      const m = /^[a-z]+\[(\d+)\]$/.exec(where);
      if (m && list[+m[1]] && typeof list[+m[1]].id === "string") where = list[+m[1]].id;
      const rec = { level, code: it.code, where, message: it.message };
      res.all.push(rec);
      if (groups.has(where)) (res.byGroup[where] ||= []).push(rec);
      else if (tables.has(where.split(".")[0])) (res.byTable[where.split(".")[0]] ||= []).push(rec);
      else (res.byEntry[where] ||= []).push(rec);
    }
  }
  return res;
}

        el("td", { class: x.status === "failed" ? "off" : "", text: { passed: "통과", failed: "실패", open: "판정 없음", none: "기록 없음" }[x.status] || x.status }))), "") : null));
  }
  return out;
}

function renderSystems(ds, idx) {
  const r = ds.report || {};
  const list = (Array.isArray(ds.data.systems) ? ds.data.systems : []).filter((e) => e && typeof e === "object");
  const rows = Array.isArray(r.rows) ? r.rows : list.map((s) => ({ ...s, order: null, rules: Array.isArray(s.rules) ? s.rules.length : 0 }));
  const scopes = { mvp: "MVP", later: "나중", out: "범위 밖" };
  const text = (v) => (Array.isArray(v) && v.length ? v.join(", ") : "–");
  const note = (x) => el("div", { class: "group-note", text: "⚠ " + x.message });
  const known = new Set(list.map((e) => e.id));
  const body = rows.map((x) => {
    const entry = list.find((e) => e.id === x.id) || {};
    const issues = idx.byEntry[x.id] || [];
    return el("tr", { "data-id": x.id, class: issues.length ? "has-warn" : "" },
      el("td", { class: "num" }, x.order === null || x.order === undefined ? dash() : String(x.order)),
      el("td", { class: "name" }, el("div", { class: "nm", text: x.name || x.id }), x.name ? el("div", { class: "mono muted", text: x.id }) : null,
        entry.intent ? el("div", { class: "muted", text: entry.intent }) : null, ...issues.map(note)),
      el("td", { text: (scopes[x.scope] || String(x.scope)) + (x.foundation === true ? "(기반)" : "") }), el("td", { text: text(x.pillars) }), el("td", { text: text(x.mvp) }),
      el("td", { class: "mono", text: text(x.depends_on) }),
      el("td", {}, Array.isArray(entry.rules) && entry.rules.length ? el("ul", {}, entry.rules.filter((u) => u && typeof u === "object").map((u) => el("li", { text: u.text || u.id || "?" }))) : dash()));
  });
  const heads = ["순서", "시스템", "범위", "필러", "MVP", "의존", "규칙"];
  return [el("section", { class: "panel", id: "group-all" },
    el("div", { class: "ph" }, el("h2", {}, "시스템"), el("span", { class: "group-meta", text: r.concept ? `컨셉 ${r.concept}` : "브리프와의 연결은 서버 모드에서 봅니다." })),
    ...idx.all.filter((x) => !known.has(x.where)).map(note),
    el("div", { class: "tw" }, el("table", {}, el("thead", {}, el("tr", {}, ...heads.map((h) => el("th", {}, h)))),
      el("tbody", {}, body.length ? body : [el("tr", {}, el("td", { colspan: String(heads.length), class: "muted", text: "시스템이 없습니다." }))]))))];
}

// 판정 글에 옮겨 적은 잣대 태그(가정·결정)는 브리프와 어긋날 수 있어 빼고 보인다. 출처는 브리프에 있다(studio.py check와 같은 규칙)
const YARDSTICK_TAG = /\s*\[(?:가정|assumed|결정|decided)(?:\s*[:：][^\]]*)?\]/g;
function withoutYardstickTags(text) { return String(text).replace(YARDSTICK_TAG, ""); }

function renderPlaytests(ds, idx) {
  const sessions = (Array.isArray(ds.data.playtests) ? ds.data.playtests : []).filter((e) => e && typeof e === "object");
  const verdicts = (Array.isArray(ds.data.verdicts) ? ds.data.verdicts : []).filter((v) => v && typeof v === "object");
  const computed = (ds.report && ds.report.verdicts) || {};
  const rowClass = (issues, extra) => [extra || "", issues.some((x) => x.level === "err") ? "has-err" : issues.some((x) => x.level === "warn") ? "has-warn" : ""].join(" ").trim();
  const badges = (issues) => (issues.length ? el("div", { class: "badges" }, issues.map((x) => el("span", { class: "tag " + x.level, title: x.message, text: LABEL.code[x.code] || x.code }))) : null);
  const order = { approved: 0, proposed: 1, unspecified: 2, cut: 3 };
  const vrows = verdicts.filter((v) => matches(ds, v, idx.byEntry[`${v.concept}.${v.hypothesis}`]))
    .sort((a, b) => order[a.status || "unspecified"] - order[b.status || "unspecified"])
    .map((v) => {
      const where = `${v.concept}.${v.hypothesis}`, issues = v.status === "cut" ? [] : (idx.byEntry[where] || []);
      const sample = v.status !== "cut" && computed[where] ? computed[where].sample : null;
      const st = v.status || "unspecified";
      return el("tr", { "data-id": v.status === "cut" ? "" : where, class: rowClass(issues, st === "cut" ? "cut" : "") },
        el("td", { class: "name" }, el("div", { class: "mono", text: where }), badges(issues)),
        el("td", {}, el("span", { class: "pill vd-" + v.result, text: LABEL.verdict[v.result] || String(v.result) }),
          v.proposed_result && v.proposed_result !== v.result   // 사용자가 판정 에이전트의 제안을 모름으로 낮춰 확정했다
            ? el("div", { class: "muted", text: "판정 에이전트는 " + (LABEL.verdict[v.proposed_result] || String(v.proposed_result)) }) : null),
        el("td", {}, el("span", { class: "pill st-" + st, text: LABEL.verdictStatus[st] || st })),
        el("td", { class: "mono" }, Array.isArray(v.sessions) && v.sessions.length ? v.sessions.join(", ") : dash()),
        el("td", {}, sample ? computed[where].sample_text : dash(ds.report ? "–" : "서버 모드")),   // check의 판정 줄과 같은 글
        el("td", { class: "text" }, v.reason ? withoutYardstickTags(v.reason) : dash(),
          v.next_needs ? el("div", { class: "muted", text: "다음 시험 전에 풀 것: " + withoutYardstickTags(v.next_needs) }) : null,
          v.cut_reason ? el("div", { class: "muted", text: "지운 까닭: " + v.cut_reason }) : null));
    });
  const gate = ds.report && ds.report.unverified && ds.report.unverified.length
    ? el("div", { class: "group-note", text: "확정된 버팀·틀림이 아닌 가설: " + ds.report.unverified.join(", ") }) : null;
  const refutedNote = ds.report && ds.report.refuted && ds.report.refuted.length
    ? el("div", { class: "group-note", text: "틀림으로 확정된 가설(선택한 컨셉): " + ds.report.refuted.join(", ") }) : null;
  // 상태 필터는 판정에만 적용한다. 세션에는 상태가 없다.
  const srows = sessions.filter((e) => matches(ds, { ...e, status: ui(ds).status || undefined }, idx.byEntry[e.id]))
    .sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.id).localeCompare(String(b.id)))
    .map((e) => {
      const issues = idx.byEntry[e.id] || [];
      const obs = Array.isArray(e.observations) && e.observations.length
        ? el("ul", {}, e.observations.map((o) => el("li", {}, el("span", { class: "mono", text: ((o && o.hypothesis) || "?") + ": " }),
            String(o && o.value !== undefined ? o.value : "?") + (o && o.n !== undefined ? ` (n=${o.n})` : ""),
            o && o.metric ? el("div", { class: "muted", text: o.metric }) : null))) : dash("관찰값 없음");
      const stageItems = (list) => (Array.isArray(list) ? list : []).map((x) => el("li", {}, el("span", { class: "mono", text: ((x && x.stage) || "?") + ": " }),
        `${x && x.cleared}/${x && x.entered}판 통과` + (x && x.level !== undefined ? ` · 레벨 ${fmt(x.level)}` : "") + (x && x.level_end !== undefined ? ` · 끝 레벨 ${fmt(x.level_end)}` : "")
        + (x && x.duration !== undefined ? ` · 길이 ${fmt(x.duration)}` : "") + (x && x.timed === true ? " · 시간 제한" : "")));
      const groupItems = (Array.isArray(e.groups) ? e.groups : []).filter((g) => g && typeof g === "object").flatMap((g) => [
        el("li", { class: "muted", text: "강화: " + (Array.isArray(g.upgrades) && g.upgrades.length ? g.upgrades.join(", ") : "없음") }), ...stageItems(g.stage_stats)]);
      const greyItems = (Array.isArray(e.greybox) ? e.greybox : []).filter((x) => x && typeof x === "object").map((x) => el("li", {}, el("span", { class: "mono", text: `그레이박스 ${x.check}: ` }),
        (x.value !== undefined ? fmt(x.value) : x.passed === true ? "통과" : x.passed === false ? "실패" : "?") + (x.n !== undefined ? ` (n=${x.n})` : "")));
      const stageList = [...stageItems(e.stage_stats), ...groupItems, ...greyItems];
      const stageStats = stageList.length ? el("ul", {}, stageList) : null;
      const notes = Array.isArray(e.notes) && e.notes.length
        ? el("ul", {}, e.notes.map((n) => el("li", {}, el("span", { class: "tag info", text: LABEL.note[n && n.kind] || (n && n.kind) || "?" }), (n && n.text) || ""))) : dash();
      return el("tr", { "data-id": e.id || "", class: rowClass(issues) },
        el("td", { class: "name" }, el("div", { class: "nm", text: e.date || "(날짜 없음)" }), el("div", { class: "mono muted", text: e.id || "(id 없음)" }), badges(issues)),
        el("td", { class: "mono" }, e.concept || dash()),
        el("td", { class: "mono" }, e.build || dash()),
        el("td", {}, Array.isArray(e.players) ? e.players.join(", ") : dash()),
        el("td", { class: "num" }, e.runs !== undefined ? String(e.runs) : dash()),
        el("td", { class: "text" }, stageStats ? [stageStats, Array.isArray(e.observations) && e.observations.length ? obs : null] : obs),
        el("td", { class: "text" }, notes));
    });
  const ids = new Set([...sessions.map((e) => e.id), ...verdicts.map((v) => `${v.concept}.${v.hypothesis}`)]);
  const other = idx.all.filter((x) => !ids.has(x.where)).map((x) => el("div", { class: "group-note", text: "⚠ " + x.message }));
  const table = (heads, rows, empty) => el("div", { class: "tw" }, el("table", {}, el("thead", {}, el("tr", {}, ...heads.map((h) => el("th", {}, h)))),
    el("tbody", {}, rows.length ? rows : [el("tr", {}, el("td", { colspan: String(heads.length), class: "muted", text: empty }))])));
  return [
    el("section", { class: "panel", id: "group-all" },
      el("div", { class: "ph" }, el("h2", {}, "가설 판정", el("span", { class: "muted", text: `${vrows.length} / ${verdicts.length}` }),
        el("span", { class: "group-meta", text: "기록만 근거로 합니다. 재미를 점수로 매기지 않습니다. 확정은 사용자가 합니다." }))),
      gate, refutedNote, ...other,
      table(["가설", "판정", "상태", "근거 세션", "표본", "이유"], vrows, "판정이 아직 없습니다.")),
    el("section", { class: "panel" },
      el("div", { class: "ph" }, el("h2", {}, "세션", el("span", { class: "muted", text: `${srows.length} / ${sessions.length}` }))),
      table(["날짜 (id)", "컨셉", "빌드", "플레이한 사람", "판 수", "관찰값", "메모"], srows, "세션이 아직 없습니다.")),
  ];
}

function render() {
  if (!state.snap) return;
  const ds = activeDataset();
  renderTabs();
  const banner = document.getElementById("banner");
  const failed = state.snap.datasets.filter((d) => !d.ok);
  banner.hidden = failed.length === 0;
  banner.textContent = failed.map((d) => `${d.name}: ${d.error}`).join("\n");
  const notices = document.getElementById("notices");
  const said = Array.isArray(state.snap.notices) ? state.snap.notices : [];
  notices.hidden = said.length === 0;
  notices.textContent = said.map((text) => "참고: " + text).join("\n");
  if (!ds || !ds.ok) {
    for (const id of ["sections", "extras", "summary"]) document.getElementById(id).replaceChildren();
    document.getElementById("controls").hidden = true;
    document.getElementById("issues-panel").hidden = true;
    if (!state.snap.datasets.length && state.mode === "server") document.getElementById("sections").replaceChildren(renderEmpty(state.snap));
    return;
  }
  state.active = ds.path;
  const idx = indexIssues(ds);
  renderSummary(ds, idx);
  renderSections(ds, idx);
  document.getElementById("footer").textContent = (state.mode === "server"
    ? "읽기 전용 뷰어입니다. 수정은 원본 파일에서 합니다. 점수·위협도 = Σ(스탯 × 가중치)이며 같은 묶음 안에서만 비교합니다. 고유 효과는 점수로 비교할 수 없습니다."
    : "파일 모드: 원본에 적힌 값만 보여 줍니다. 검사·계산 결과를 보려면 서버로 실행하세요: " + SERVER_HINT) + ` · 원본: ${ds.path}`;
}

function renderEmpty(snap) {
  const files = [["design/concepts.json", "컨셉 탐색 기록"], ["design/systems.json", "시스템 설계"], ["data/items.json", "아이템"], ["data/upgrades.json", "영구 강화"], ["data/enemies.json", "적"], ["data/combat.json", "전투 계산"], ["data/budget.json", "스탯 예산"], ["data/growth.json", "판 안 성장"], ["data/crafting.json", "강화·합성"], ["data/economy.json", "재화 흐름"], ["data/levels.json", "레벨 구성"], ["data/playtests.json", "플레이 기록과 가설 판정"]];
  return el("section", { class: "panel", id: "empty" },
    el("div", { class: "ph" }, el("h2", {}, "아직 데이터가 없습니다")),
    el("div", { class: "doc" },
      el("p", { text: "아래 위치에 데이터 파일이 생기면 이 화면에 자동으로 나타납니다. 새로고침하지 않아도 됩니다." }),
      el("h3", { text: "지켜보는 위치" }),
      el("ul", {}, (snap.watched || []).map((w) => el("li", { class: "mono", text: w }))),
      el("h3", { text: "예를 들면" }),
      el("ul", {}, files.map(([f, d]) => el("li", {}, el("span", { class: "mono", text: f }), " — " + d))),
      el("p", { class: "muted", text: "컨셉 탐색 스킬을 쓰면 design/concepts.json이 만들어집니다." })));
}

function applySnapshot(snap) {
  const prev = state.snap;
  const rank = (d) => { const i = KIND_ORDER.indexOf(d.kind); return i < 0 ? KIND_ORDER.length : i; };
  snap.datasets.sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));
  state.snap = snap;
  if (prev && state.active && !snap.datasets.some((d) => d.path === state.active)) state.active = null;
  render();
}

/* ---------- 서버 모드 ---------- */
async function pollServer() {
  const dot = document.getElementById("dot"), live = document.getElementById("live");
  try {
    const res = await fetch("/api/data", { cache: "no-store" });
    if (!res.ok) throw new Error(res.status);
    const snap = await res.json();
    if (state.mode !== "server") {
      state.mode = "server";
      const mode = document.getElementById("mode");
      mode.className = "mode server";
      mode.textContent = "서버 모드 · 검사 포함";
    }
    dot.className = "dot";
    if (!state.snap || snap.version !== state.snap.version) {
      applySnapshot(snap);
      live.textContent = "실시간 동기화 · 갱신 " + new Date().toLocaleTimeString();
    }
    return true;
  } catch (e) {
    dot.className = "dot off";
    live.textContent = "뷰어 서버 연결 끊김";
    return false;
  }
}

/* ---------- 파일 모드: 원본 값만, 검사 없음 ---------- */
function detectKind(data) {
  if (!data || typeof data !== "object" || Array.isArray(data)) return null;
  if ("rooms" in data && "difficulty" in data) return null;
  return KIND_ORDER.find((k) => Array.isArray(data[k]) || (OBJECT_KINDS.includes(k) && data[k] && typeof data[k] === "object" && !Array.isArray(data[k])))
    || ("threat_budget" in data ? "levels" : null);
}

async function loadFileTexts(named) {
  const datasets = named.map(({ name, text }) => {
    const ds = { name, path: name, ok: false, kind: null, report: null, version: text.length + ":" + name };
    if (!name.toLowerCase().endsWith(".json")) { ds.error = "파일 모드에서는 JSON만 읽습니다. CSV는 서버 모드로 보세요."; return ds; }
    try {
      const data = JSON.parse(text), kind = detectKind(data);
      if (!kind) ds.error = "컨셉·시스템 설계·아이템·영구 강화·적·전투 계산·판 안 성장·스탯 예산·강화·합성·재화 흐름·레벨 구성·플레이 기록 데이터가 아닙니다 (최상위에 concepts / systems / items / upgrades / enemies / levels / playtests 배열이나 combat / growth / budget / crafting / economy 객체가 필요합니다).";
      else Object.assign(ds, { ok: true, kind, data });
    } catch (e) { ds.error = "JSON 형식 오류: " + e.message; }
    return ds;
  });
  applySnapshot({ mode: "file", version: named.map((n) => n.text).join("\u0000"), datasets });
  document.getElementById("live").textContent = "불러옴 " + new Date().toLocaleTimeString();
}

async function readHandles() {
  const files = await Promise.all(state.file.handles.map((h) => h.getFile()));
  const named = await Promise.all(files.map(async (f) => ({ name: f.name, text: await f.text() })));
  const joined = named.map((n) => n.text).join("\u0000");
  if (!state.snap || state.snap.version !== joined) await loadFileTexts(named);
}

async function useHandles(handles) {
  state.file.handles = handles;
  await readHandles();
  document.getElementById("dot").className = "dot";
  document.getElementById("reload").hidden = true;
  document.getElementById("file-note").firstChild.textContent =
    "고른 파일을 계속 지켜보며 바뀌면 다시 읽습니다 (Chrome·Edge). 파일 모드는 원본에 적힌 값만 보여 줍니다. 검사·계산은 하지 않습니다. 검사 결과까지 보려면 서버로 실행하세요: ";
  if (!state.file.timer) state.file.timer = setInterval(() => readHandles().catch(() => {
    document.getElementById("dot").className = "dot off";
    document.getElementById("live").textContent = "파일을 다시 읽지 못했습니다";
  }), 1500);
}

async function useFiles(fileList) {
  const named = await Promise.all([...fileList].map(async (f) => ({ name: f.name, text: await f.text() })));
  state.file.handles = null;
  await loadFileTexts(named);
  document.getElementById("dot").className = "dot idle";
  document.getElementById("reload").hidden = false;
}

function enterFileMode(reason) {
  state.mode = "file";
  const mode = document.getElementById("mode");
  mode.className = "mode file";
  mode.textContent = "파일 모드 · 검사 없음";
  document.getElementById("filebar").classList.add("show");
  document.getElementById("live").textContent = reason || "파일을 불러오세요";
  document.getElementById("dot").className = "dot idle";
}

function setupFileMode() {
  const input = document.getElementById("file-input");
  const pick = async () => {
    if (window.showOpenFilePicker) {
      try { await useHandles(await window.showOpenFilePicker({ multiple: true, types: [{ description: "JSON", accept: { "application/json": [".json"] } }] })); }
      catch (e) { if (e.name !== "AbortError") input.click(); }
    } else input.click();
  };
  document.getElementById("pick").addEventListener("click", pick);
  document.getElementById("reload").addEventListener("click", pick);
  input.addEventListener("change", () => { if (input.files.length) useFiles(input.files); input.value = ""; });
  const bar = document.getElementById("filebar");
  bar.addEventListener("dragover", (e) => { e.preventDefault(); bar.classList.add("drag"); });
  bar.addEventListener("dragleave", () => bar.classList.remove("drag"));
  bar.addEventListener("drop", async (e) => {
    e.preventDefault(); bar.classList.remove("drag");
    const items = [...(e.dataTransfer.items || [])].filter((i) => i.kind === "file");
    if (items.length && items[0].getAsFileSystemHandle) {
      const handles = (await Promise.all(items.map((i) => i.getAsFileSystemHandle()))).filter((h) => h && h.kind === "file");
      if (handles.length) { await useHandles(handles); return; }
    }
    if (e.dataTransfer.files.length) useFiles(e.dataTransfer.files);
  });
}

/* ---------- 시작 ---------- */
document.getElementById("q").addEventListener("input", (e) => { const ds = activeDataset(); if (ds) { ui(ds).q = e.target.value.trim(); render(); } });
document.getElementById("status").addEventListener("change", (e) => { const ds = activeDataset(); if (ds) { ui(ds).status = e.target.value; render(); } });
document.getElementById("only-issues").addEventListener("change", (e) => { const ds = activeDataset(); if (ds) { ui(ds).onlyIssues = e.target.checked; render(); } });
document.getElementById("issues-panel").addEventListener("toggle", (e) => { e.target.dataset.touched = "1"; });
setupFileMode();

(async function start() {
  if (location.protocol === "file:") { enterFileMode(); return; }
  if (await pollServer()) {
    setInterval(pollServer, 1500);
  } else {
    enterFileMode("서버에 연결하지 못했습니다 — 파일을 불러오세요");
  }
})();
</script>
