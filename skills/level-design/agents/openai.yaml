interface:
  display_name: "레벨 구성"
  short_description: "레벨을 조우(방·웨이브) 순서로 적고, 위협도를 곡선 예산과 비교하며 전투 단계·재화 흐름에 맞춰 보고, 쉬는 곳·보상 사이의 부담과 그레이박스 확인 목록을 관리함"
  default_prompt: "Use $level-design to lay out this game's levels as ordered encounters, compare each encounter's threat with the budget curve, check pacing between rests and rewards, and report anything off budget or out of step with combat and economy data."
