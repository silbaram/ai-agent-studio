<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이템 데이터</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --on-accent: #ffffff; --text: #1d2330; --muted: #667085; --line: #e4e7ec;
    --head: #f2f4f7; --accent: #3b5bdb; --err: #c92a2a; --err-bg: #fff0f0; --warn: #b35c00; --warn-bg: #fff6e5;
    --ok: #2b8a3e; --ok-bg: #ebfbee; --flash: #fff3bf;
    --r-common: #868e96; --r-uncommon: #2f9e44; --r-rare: #1c7ed6; --r-epic: #9c36b5; --r-legendary: #e8590c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1a1f27; --on-accent: #0d1426; --text: #e6e9ef; --muted: #98a2b3; --line: #2a313c;
      --head: #202631; --accent: #7c9cff; --err: #ff8787; --err-bg: #3a1f22; --warn: #ffb347; --warn-bg: #3a2c14;
      --ok: #69db7c; --ok-bg: #1d3323; --flash: #4a3f12;
      --r-common: #adb5bd; --r-uncommon: #69db7c; --r-rare: #74c0fc; --r-epic: #e599f7; --r-legendary: #ffa94d;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 12px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 0; display: flex; align-items: baseline; gap: 8px; }
  .muted { color: var(--muted); }
  .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; }
  .live { margin-left: auto; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.off { background: var(--err); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 16px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .chip b { font-weight: 600; }
  .chip.fail { color: var(--err); border-color: var(--err); }
  .chip.pass { color: var(--ok); border-color: var(--ok); }
  .banner { border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; background: var(--err-bg); color: var(--err); border: 1px solid var(--err); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; }
  .panel > .ph { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  details.panel > summary { padding: 10px 14px; cursor: pointer; font-weight: 600; }
  .issues { list-style: none; margin: 0; padding: 0 14px 10px; }
  .issues li { padding: 4px 0; border-top: 1px dashed var(--line); cursor: pointer; }
  .issues li:first-child { border-top: 0; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; border-radius: 4px; padding: 0 6px; margin-right: 6px; }
  .tag.err { background: var(--err-bg); color: var(--err); }
  .tag.warn { background: var(--warn-bg); color: var(--warn); }
  .tag.info { background: var(--head); color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 16px; }
  .controls input[type=search] { flex: 1 1 220px; min-width: 0; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  .controls select { padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); }
  .seg { display: flex; flex-wrap: wrap; gap: 4px; }
  .seg button { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 12px; }
  .seg button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  label.check { display: flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
  .tw { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; white-space: nowrap; }
  th { background: var(--head); font-weight: 600; font-size: 12px; color: var(--muted); position: sticky; top: 0; cursor: pointer; user-select: none; }
  th.sorted::after { content: " ▲"; }
  th.sorted.desc::after { content: " ▼"; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.text { white-space: normal; min-width: 220px; max-width: 360px; }
  tr.cut td { opacity: .5; }
  tr.cut td.name .nm { text-decoration: line-through; }
  tr.flash td { background: var(--flash); transition: background .2s; }
  tr.has-err td:first-child { box-shadow: inset 3px 0 0 var(--err); }
  tr.has-warn td:first-child { box-shadow: inset 3px 0 0 var(--warn); }
  .nm { font-weight: 600; }
  .empty { color: var(--muted); }
  .pill { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: 12px; border: 1px solid currentColor; }
  .st-proposed { color: var(--accent); } .st-approved { color: var(--ok); } .st-cut { color: var(--muted); } .st-unspecified { color: var(--muted); border-style: dashed; }
  .pv-assumed { color: var(--warn); } .pv-computed { color: var(--accent); } .pv-measured { color: var(--ok); } .pv-unspecified { color: var(--muted); border-style: dashed; }
  .rarity { font-weight: 600; }
  .badges { margin-top: 2px; display: flex; flex-wrap: wrap; gap: 4px; }
  .intent { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .slot-note { font-size: 12px; color: var(--warn); padding: 8px 14px 0; }
  .drops { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; padding: 12px 14px 14px; }
  .drop { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .bar { display: grid; grid-template-columns: 72px 1fr 56px; gap: 8px; align-items: center; font-size: 12px; margin: 4px 0; }
  .bar .track { height: 8px; background: var(--head); border-radius: 4px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); }
  footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>아이템 데이터</h1>
    <span class="mono muted" id="path"></span>
    <span class="live"><span class="dot" id="dot"></span><span id="live">불러오는 중…</span></span>
  </header>
  <div id="banner" class="banner" hidden></div>
  <div class="chips" id="summary"></div>
  <details class="panel" id="issues-panel" hidden>
    <summary id="issues-title"></summary>
    <ul class="issues" id="issues"></ul>
  </details>
  <div class="controls">
    <input type="search" id="q" placeholder="이름·id·효과 검색" aria-label="검색">
    <div class="seg" id="slots" role="group" aria-label="부위"></div>
    <select id="status" aria-label="상태">
      <option value="">상태 전체</option>
      <option value="proposed">제안</option>
      <option value="approved">승인</option>
      <option value="cut">삭제</option>
      <option value="unspecified">미지정</option>
    </select>
    <label class="check"><input type="checkbox" id="only-issues"> 문제 있는 것만</label>
  </div>
  <div id="sections"></div>
  <section class="panel" id="drops-panel" hidden>
    <div class="ph"><h2>드랍 테이블</h2></div>
    <div class="drops" id="drops"></div>
  </section>
  <footer>
    읽기 전용 뷰어입니다. 수정은 원본 파일에서 합니다. 점수 = Σ(스탯 × 가중치), 같은 부위 안에서만 비교합니다.
    고유 효과가 있는 아이템은 점수만으로 비교할 수 없습니다.
  </footer>
</main>
<script>
"use strict";
const LABEL = {
  slot: { weapon: "무기", armor: "방어구", relic: "유물", accessory: "장신구", consumable: "소모품" },
  rarity: { common: "일반", uncommon: "고급", rare: "희귀", epic: "영웅", legendary: "전설" },
  status: { proposed: "제안", approved: "승인", cut: "삭제", unspecified: "미지정" },
  prov: { assumed: "가정", computed: "계산", measured: "측정", unspecified: "미지정" },
  code: { dominated: "열위", tier_inversion: "티어 역전", schema: "형식", duplicate_id: "중복 id",
          unknown_item: "없는 아이템", provenance: "출처", pity_target_missing: "천장 대상 없음", cut_item_referenced: "삭제 아이템 드랍" },
};
const RARITY_ORDER = ["common", "uncommon", "rare", "epic", "legendary"];
const rarityRank = (r) => { const i = RARITY_ORDER.indexOf(r); return i < 0 ? RARITY_ORDER.length : i; };
const state = { version: null, snap: null, slot: "", status: "", q: "", onlyIssues: false, sort: {} };

function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
const fmt = (v) => (typeof v === "number" ? (Number.isInteger(v) ? String(v) : String(+v.toFixed(4))) : v);
const label = (kind, key, data) => ((data && data[kind + "_labels"] && data[kind + "_labels"][key]) || LABEL[kind][key] || key);

function indexIssues(snap) {
  const items = Array.isArray(snap.data.items) ? snap.data.items : [];
  const byItem = {}, bySlot = {}, byTable = {};
  const slots = new Set(items.filter((i) => i && i.slot).map((i) => i.slot));
  const tables = new Set(Object.keys(snap.data.drop_tables || {}));
  const all = [];
  for (const [level, list] of [["err", snap.report.errors], ["warn", snap.report.warnings]]) {
    for (const it of list) {
      let where = it.where;
      const m = /^items\[(\d+)\]$/.exec(where);
      if (m && items[+m[1]] && typeof items[+m[1]].id === "string") where = items[+m[1]].id;
      const rec = { level, code: it.code, where, message: it.message };
      all.push(rec);
      const table = where.split(".")[0];
      if (slots.has(where)) (bySlot[where] ||= []).push(rec);
      else if (tables.has(table)) (byTable[table] ||= []).push(rec);
      else (byItem[where] ||= []).push(rec);
    }
  }
  return { all, byItem, bySlot, byTable };
}

function renderSummary(snap, idx) {
  const r = snap.report, s = r.status_counts, p = r.provenance_counts;
  const errs = r.errors.length, warns = r.warnings.length;
  const box = document.getElementById("summary");
  box.replaceChildren(
    el("span", { class: "chip " + (errs ? "fail" : "pass") }, el("b", { text: errs ? "오류 있음" : "오류 없음" })),
    el("span", { class: "chip" }, "아이템 ", el("b", { text: r.items })),
    el("span", { class: "chip" }, `제안 ${s.proposed} · 승인 ${s.approved} · 삭제 ${s.cut}` + (s.unspecified ? ` · 상태 미지정 ${s.unspecified}` : "")),
    el("span", { class: "chip" }, `출처 가정 ${p.assumed} · 계산 ${p.computed} · 측정 ${p.measured}` + (p.unspecified ? ` · 미지정 ${p.unspecified}` : "")),
    el("span", { class: "chip" }, `오류 ${errs} · 경고 ${warns}`),
  );
  const panel = document.getElementById("issues-panel");
  panel.hidden = idx.all.length === 0;
  document.getElementById("issues-title").textContent = `검사 결과: 오류 ${errs} · 경고 ${warns}`;
  if (errs && !panel.dataset.touched) panel.open = true;
  document.getElementById("issues").replaceChildren(...idx.all.map((it) =>
    el("li", { onclick: () => focusRow(it.where) },
      el("span", { class: "tag " + it.level, text: (it.level === "err" ? "오류 · " : "경고 · ") + (LABEL.code[it.code] || it.code) }),
      el("span", { class: "mono", text: it.where + " " }), it.message)));
}

function focusRow(id) {
  const row = document.querySelector(`tr[data-id="${CSS.escape(id)}"]`) || document.getElementById("slot-" + id) || document.getElementById("drop-" + id.split(".")[0]);
  if (!row) return;
  row.scrollIntoView({ behavior: "smooth", block: "center" });
  row.classList.add("flash");
  setTimeout(() => row.classList.remove("flash"), 1200);
}

function renderSlotsFilter(slots, data) {
  const box = document.getElementById("slots");
  const btn = (value, text) => el("button", { class: state.slot === value ? "on" : "", type: "button",
    onclick: () => { state.slot = value; render(); } }, text);
  box.replaceChildren(btn("", "전체"), ...slots.map((s) => btn(s, label("slot", s, data))));
}

function matches(item, issues) {
  const status = item.status || "unspecified";
  if (state.slot && item.slot !== state.slot) return false;
  if (state.status && status !== state.status) return false;
  if (state.onlyIssues && !(issues && issues.length)) return false;
  if (state.q) {
    const hay = [item.id, item.name, item.effect, item.intent].filter(Boolean).join(" ").toLowerCase();
    if (!hay.includes(state.q.toLowerCase())) return false;
  }
  return true;
}

function sortRows(rows, slot, scores) {
  const s = state.sort[slot] || { key: "tier", desc: false };
  const val = (it) => s.key === "tier" ? it.tier : s.key === "price" ? it.price : s.key === "score" ? scores[it.id]
    : s.key.startsWith("stat:") ? (it.stats || {})[s.key.slice(5)] : null;
  return rows.sort((a, b) => {
    const va = val(a), vb = val(b);
    const na = va === undefined || va === null, nb = vb === undefined || vb === null;
    if (na !== nb) return na ? 1 : -1;
    if (!na && va !== vb) return (va < vb ? -1 : 1) * (s.desc ? -1 : 1);
    if (s.key === "tier") return (scores[b.id] ?? 0) - (scores[a.id] ?? 0);
    return (a.tier ?? 0) - (b.tier ?? 0);
  });
}

function header(slot, key, text, num) {
  const s = state.sort[slot] || { key: "tier", desc: false };
  const on = s.key === key;
  return el("th", { class: (num ? "num " : "") + (on ? "sorted" + (s.desc ? " desc" : "") : ""),
    onclick: () => { state.sort[slot] = { key, desc: on ? !s.desc : key !== "tier" }; render(); } }, text);
}

function renderSections(snap, idx) {
  const data = snap.data, scores = snap.report.item_scores || {};
  const items = (Array.isArray(data.items) ? data.items : []).filter((i) => i && typeof i === "object");
  const slotNames = [...new Set(items.map((i) => i.slot || "(부위 없음)"))];
  renderSlotsFilter(slotNames, data);
  const out = [];
  for (const slot of slotNames) {
    const all = items.filter((i) => (i.slot || "(부위 없음)") === slot);
    const visible = all.filter((i) => matches({ ...i, slot }, idx.byItem[i.id]));
    if (!visible.length) continue;
    const statKeys = [...new Set(all.flatMap((i) => Object.keys(i.stats || {})))];
    const thead = el("tr", {}, header(slot, "tier", "티어"), el("th", {}, "이름 (id)"), el("th", {}, "희귀도"),
      header(slot, "price", "가격", true), ...statKeys.map((k) => header(slot, "stat:" + k, label("stat", k, data), true)),
      header(slot, "score", "점수", true), el("th", {}, "상태"), el("th", {}, "출처"), el("th", {}, "효과 · 의도"));
    const rows = sortRows(visible, slot, scores).map((it) => {
      const issues = idx.byItem[it.id] || [];
      const status = it.status || "unspecified";
      const prov = (it.provenance && it.provenance.kind) || "unspecified";
      const hasErr = issues.some((x) => x.level === "err"), hasWarn = issues.some((x) => x.level === "warn");
      const badges = [];
      if (it.unique_effect) badges.push(el("span", { class: "tag info", text: "고유 효과" }));
      for (const x of issues) badges.push(el("span", { class: "tag " + x.level, title: x.message, text: LABEL.code[x.code] || x.code }));
      const rarityVar = RARITY_ORDER.includes(it.rarity) ? `color: var(--r-${it.rarity})` : null;
      return el("tr", { "data-id": it.id || "", class: [status === "cut" ? "cut" : "", hasErr ? "has-err" : hasWarn ? "has-warn" : ""].join(" ").trim() },
        el("td", {}, it.tier !== undefined ? "T" + it.tier : "–"),
        el("td", { class: "name" }, el("div", {}, el("span", { class: "nm", text: it.name || it.id || "(id 없음)" })),
          it.name ? el("div", { class: "mono muted", text: it.id }) : null, badges.length ? el("div", { class: "badges" }, badges) : null),
        el("td", {}, it.rarity ? el("span", { class: "rarity", style: rarityVar, text: label("rarity", it.rarity, data) }) : el("span", { class: "empty", text: "–" })),
        el("td", { class: "num" }, it.price !== undefined && it.price !== null ? fmt(it.price) : el("span", { class: "empty", text: "–" })),
        ...statKeys.map((k) => el("td", { class: "num" }, (it.stats || {})[k] !== undefined ? fmt(it.stats[k]) : el("span", { class: "empty", text: "·" }))),
        el("td", { class: "num" }, scores[it.id] !== undefined ? fmt(scores[it.id]) + (it.unique_effect ? "*" : "") : "–"),
        el("td", {}, el("span", { class: "pill st-" + status, text: LABEL.status[status] || status })),
        el("td", {}, el("span", { class: "pill pv-" + prov, title: it.provenance ? [it.provenance.source, it.provenance.note].filter(Boolean).join(" · ") : "", text: LABEL.prov[prov] || prov }),
          it.provenance && it.provenance.source ? el("div", { class: "mono muted", text: it.provenance.source }) : null),
        el("td", { class: "text" }, it.effect ? el("div", { text: it.effect }) : null, it.intent ? el("div", { class: "intent", text: "의도: " + it.intent }) : null,
          !it.effect && !it.intent ? el("span", { class: "empty", text: "–" }) : null));
    });
    const slotIssues = idx.bySlot[slot] || [];
    out.push(el("section", { class: "panel", id: "slot-" + slot },
      el("div", { class: "ph" }, el("h2", {}, label("slot", slot, data), el("span", { class: "muted", text: `${visible.length} / ${all.length}` }))),
      ...slotIssues.map((x) => el("div", { class: "slot-note", text: "⚠ " + x.message })),
      el("div", { class: "tw" }, el("table", {}, el("thead", {}, thead), el("tbody", {}, rows)))));
  }
  document.getElementById("sections").replaceChildren(...(out.length ? out : [el("p", { class: "muted", text: "조건에 맞는 아이템이 없습니다." })]));
}

function renderDrops(snap, idx) {
  const tables = snap.report.drop_tables || {}, ids = Object.keys(snap.data.drop_tables || {});
  document.getElementById("drops-panel").hidden = ids.length === 0;
  document.getElementById("drops").replaceChildren(...ids.map((tid) => {
    const t = tables[tid], issues = idx.byTable[tid] || [];
    const bars = t ? Object.entries(t.rarity_probability).sort((a, b) => rarityRank(a[0]) - rarityRank(b[0]) || a[0].localeCompare(b[0])).map(([r, p]) => el("div", { class: "bar" },
      el("span", { text: label("rarity", r, snap.data) }), el("div", { class: "track" }, el("div", { class: "fill", style: `width:${(p * 100).toFixed(2)}%` })),
      el("span", { class: "num mono", text: (p * 100).toFixed(2) + "%" }))) : [el("div", { class: "muted", text: "오류 때문에 계산하지 못했습니다." })];
    const pity = t && t.pity ? el("div", { class: "muted", style: "font-size:12px;margin-top:6px" },
      `${label("rarity", t.pity.target_rarity, snap.data)} 천장 ${t.pity.guarantee_after}회 · 평균 ${t.pity.expected_draws_with_pity.toFixed(1)}회` +
      (t.pity.expected_draws_without_pity !== null ? ` (천장 없으면 ${t.pity.expected_draws_without_pity.toFixed(1)}회)` : "") +
      ` · 천장 도달 확률 ${(t.pity.probability_pity_triggers * 100).toFixed(1)}%`) : null;
    return el("div", { class: "drop", id: "drop-" + tid }, el("div", { class: "nm mono", text: tid }), bars, pity,
      ...issues.map((x) => el("div", { class: "slot-note", style: "padding:6px 0 0", text: "⚠ " + x.message })));
  }));
}

function render() {
  const snap = state.snap;
  if (!snap || !snap.ok) return;
  const idx = indexIssues(snap);
  renderSummary(snap, idx);
  renderSections(snap, idx);
  renderDrops(snap, idx);
}

async function poll() {
  const dot = document.getElementById("dot"), live = document.getElementById("live"), banner = document.getElementById("banner");
  try {
    const res = await fetch("/api/items", { cache: "no-store" });
    const snap = await res.json();
    dot.classList.remove("off");
    document.getElementById("path").textContent = snap.path;
    if (!snap.ok) {
      banner.hidden = false;
      banner.textContent = snap.error + (state.snap ? " — 마지막으로 읽은 내용을 보여 주고 있습니다." : "");
      live.textContent = "원본 읽기 실패";
      return;
    }
    banner.hidden = true;
    if (snap.version !== state.version) {
      state.version = snap.version;
      state.snap = snap;
      render();
      live.textContent = "실시간 동기화 · 갱신 " + new Date().toLocaleTimeString();
    }
  } catch (e) {
    dot.classList.add("off");
    live.textContent = "뷰어 서버 연결 끊김";
  }
}

document.getElementById("q").addEventListener("input", (e) => { state.q = e.target.value.trim(); render(); });
document.getElementById("status").addEventListener("change", (e) => { state.status = e.target.value; render(); });
document.getElementById("only-issues").addEventListener("change", (e) => { state.onlyIssues = e.target.checked; render(); });
document.getElementById("issues-panel").addEventListener("toggle", (e) => { e.target.dataset.touched = "1"; });
poll();
setInterval(poll, 1500);
</script>
</body>
</html>
